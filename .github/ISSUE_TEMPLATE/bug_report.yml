name: Bug report
description: A skill or script does not work as described
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or script
      placeholder: skills/software-engineering/site-check
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Claude Code 2.x, macOS 14
