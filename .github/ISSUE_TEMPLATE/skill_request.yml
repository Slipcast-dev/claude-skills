name: Skill request or category change
description: Suggest a new skill, or move a skill to a better category
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options: [New skill, Move to another category, Improve an existing skill]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which skill and category, and why.
    validations:
      required: true
